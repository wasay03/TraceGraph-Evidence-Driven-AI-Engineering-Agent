<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TraceGraph</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/cytoscape.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/repos">TraceGraph</a>
    <nav id="nav" aria-label="Main"></nav>
    <form id="key-form" class="key-form">
      <label for="api-key">API key</label>
      <input id="api-key" type="password" autocomplete="off" placeholder="X-API-Key">
      <span id="health" class="dot" title="API status"></span>
    </form>
  </header>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
