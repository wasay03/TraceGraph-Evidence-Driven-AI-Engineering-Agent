[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegraph"
version = "0.1.0"
description = "Typed, ontology-first code knowledge graph with a reasoning engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "rustworkx>=0.15",
    "typer>=0.13",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[project.scripts]
tg = "tracegraph.cli.main:app"

[tool.setuptools.packages.find]
include = ["tracegraph*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
norecursedirs = ["fixtures"]
